<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家計管理アプリ</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f5; padding-bottom: 80px; }
.header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; text-align: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
.header h1 { font-size: 24px; }
.tabs { display: flex; background: white; border-bottom: 2px solid #eee; position: sticky; top: 70px; z-index: 99; overflow-x: auto; }
.tab { flex-shrink: 0; padding: 12px 16px; border: none; background: white; font-size: 14px; cursor: pointer; white-space: nowrap; }
.tab.active { background: #3498db; color: white; font-weight: bold; }
.screen { display: none; padding: 15px; }
.screen.active { display: block; }
.card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
.card h2 { font-size: 18px; margin-bottom: 15px; color: #333; }
.form-group { margin-bottom: 15px; }
.form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; font-size: 14px; }
.form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #ddd; border-radius: 8px; }
.btn { width: 100%; padding: 15px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px; }
.btn-primary { background: #3498db; color: white; }
.btn-success { background: #4caf50; color: white; }
.btn-danger { background: #f44336; color: white; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: white; padding: 15px; border-radius: 8px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
.stat-label { font-size: 12px; color: #666; margin-bottom: 5px; }
.stat-value { font-size: 20px; font-weight: bold; }
.income { color: #4caf50; }
.expense { color: #f44336; }
.balance { color: #2196f3; }
.item { padding: 15px; border-bottom: 1px solid #eee; }
.item:last-child { border-bottom: none; }
.item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
.item-title { font-weight: bold; flex: 1; }
.item-amount { font-size: 18px; font-weight: bold; margin: 0 10px; }
.item-detail { font-size: 14px; color: #666; }
.message { padding: 15px; border-radius: 8px; margin-bottom: 15px; }
.message.success { background: #d4edda; color: #155724; }
.message.error { background: #f8d7da; color: #721c24; }
.category-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.category-btn { padding: 10px; border: 2px solid #ddd; border-radius: 8px; background: white; font-size: 13px; cursor: pointer; }
.category-btn.selected { border-color: #3498db; background: #e3f2fd; font-weight: bold; }
.item-actions { display: flex; gap: 5px; }
.btn-sm { padding: 6px 12px; font-size: 14px; border-radius: 6px; border: none; cursor: pointer; white-space: nowrap; }
.edit-form { background: #e3f2fd; padding: 15px; border-radius: 8px; margin-bottom: 10px; }
.budget-card { padding: 15px; border: 2px solid #ddd; border-radius: 8px; margin-bottom: 10px; }
.budget-bar { width: 100%; height: 20px; background: #e0e0e0; border-radius: 10px; overflow: hidden; margin: 10px 0; }
.budget-fill { height: 100%; transition: width 0.3s; }
.sync-bar { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 2px solid #eee; padding: 10px; display: flex; gap: 10px; z-index: 100; }
.sync-bar .btn { margin: 0; flex: 1; padding: 12px; }
</style>
</head>
<body>
<div class="header">
<h1>💰 家計管理</h1>
</div>

<div class="tabs">
<button class="tab active" onclick="showTab('dashboard')">📊 ホーム</button>
<button class="tab" onclick="showTab('expense')">💳 支出</button>
<button class="tab" onclick="showTab('income')">💵 収入</button>
<button class="tab" onclick="showTab('expenseHistory')">📋 支出履歴</button>
<button class="tab" onclick="showTab('incomeHistory')">💵📋 収入履歴</button>
<button class="tab" onclick="showTab('budgets')">📈 予算</button>
</div>

<div id="dashboard" class="screen active">
<div class="stats">
<div class="stat"><div class="stat-label">全期間収入</div><div class="stat-value income" id="totalIncome">¥0</div></div>
<div class="stat"><div class="stat-label">全期間支出</div><div class="stat-value expense" id="totalExpense">¥0</div></div>
<div class="stat"><div class="stat-label">全期間収支</div><div class="stat-value balance" id="totalBalance">¥0</div></div>
</div>
<div class="card">
<h2>📊 今月の収支</h2>
<div style="margin-bottom: 10px;"><input type="month" id="dashMonth" onchange="updateDashboard()" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ddd;"></div>
<div class="stats">
<div class="stat"><div class="stat-label">収入</div><div class="stat-value income" id="monthIncome">¥0</div></div>
<div class="stat"><div class="stat-label">支出</div><div class="stat-value expense" id="monthExpense">¥0</div></div>
<div class="stat"><div class="stat-label">収支</div><div class="stat-value balance" id="monthBalance">¥0</div></div>
</div>
</div>
<div class="card"><h2>📋 カテゴリ別支出</h2><div id="categoryBreakdown"></div></div>
<div class="card"><h2>最近の支出</h2><div id="recentExpenses"></div></div>
</div>

<div id="expense" class="screen">
<div id="expenseMessage"></div>
<div class="card">
<h2>💳 支出を記録</h2>
<form id="expenseForm" onsubmit="addExpense(event)">
<div class="form-group"><label>日付</label><input type="date" id="expenseDate" required></div>
<div class="form-group"><label>カテゴリ</label><div class="category-grid" id="categoryButtons"></div></div>
<input type="hidden" id="selectedCategory">
<div class="form-group"><label>品目</label><input type="text" id="expenseItem" placeholder="例: スーパーで買い物" required></div>
<div class="form-group"><label>金額（円）</label><input type="number" id="expenseAmount" placeholder="3200" min="0" required></div>
<div class="form-group"><label>メモ（任意）</label><textarea id="expenseMemo" rows="2"></textarea></div>
<button type="submit" class="btn btn-primary">保存</button>
</form>
</div>
</div>

<div id="income" class="screen">
<div id="incomeMessage"></div>
<div class="card">
<h2>💵 収入を記録</h2>
<form id="incomeForm" onsubmit="addIncome(event)">
<div class="form-group"><label>年月</label><input type="month" id="incomeMonth" required></div>
<div class="form-group"><label>種別</label><select id="incomeType" required><option value="給与">給与</option><option value="副収入">副収入</option><option value="賞与">賞与</option><option value="その他">その他</option></select></div>
<div class="form-group"><label>金額（円）</label><input type="number" id="incomeAmount" placeholder="450000" min="0" required></div>
<div class="form-group"><label>メモ（任意）</label><input type="text" id="incomeMemo"></div>
<button type="submit" class="btn btn-primary">保存</button>
</form>
</div>
</div>

<div id="expenseHistory" class="screen">
<div class="card">
<h2>フィルタ</h2>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px;">
<input type="month" id="filterExpMonth" placeholder="年月" onchange="filterExpenses()">
<select id="filterExpCategory" onchange="filterExpenses()"><option value="">全カテゴリ</option></select>
</div>
<input type="text" id="filterExpKeyword" placeholder="キーワード検索" onchange="filterExpenses()" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ddd;">
<button class="btn" onclick="clearExpFilter()" style="background: #9e9e9e; color: white;">クリア</button>
</div>
<div class="card"><h2 id="expHistoryCount">0件</h2><div id="expHistoryList"></div></div>
</div>

<div id="incomeHistory" class="screen">
<div class="card">
<h2>フィルタ</h2>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
<input type="month" id="filterIncMonth" onchange="filterIncome()">
<select id="filterIncType" onchange="filterIncome()"><option value="">全種別</option><option value="給与">給与</option><option value="副収入">副収入</option><option value="賞与">賞与</option><option value="その他">その他</option></select>
</div>
<button class="btn" onclick="clearIncFilter()" style="background: #9e9e9e; color: white;">クリア</button>
</div>
<div class="card"><h2 id="incHistoryCount">0件</h2><div id="incHistoryList"></div></div>
</div>

<div id="budgets" class="screen">
<div class="card">
<h2>📈 予算管理</h2>
<div style="margin-bottom: 10px;"><input type="month" id="budgetMonth" onchange="updateBudgets()" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ddd;"></div>
<form id="budgetForm" onsubmit="addBudget(event)" style="display: grid; grid-template-columns: 1fr 100px 80px; gap: 10px; align-items: end; margin-bottom: 15px;">
<select id="budgetCategory" required><option value="">カテゴリ</option></select>
<input type="number" id="budgetLimit" placeholder="上限" min="0" required>
<button type="submit" class="btn btn-primary" style="margin: 0;">設定</button>
</form>
</div>
<div id="budgetList"></div>
</div>

<div class="sync-bar">
<button class="btn btn-primary" onclick="loadFromOneDrive()">🔄 読込</button>
<button class="btn btn-success" onclick="saveToOneDrive()">☁️ 保存</button>
</div>

<script>const categories = [
  {id:'c01',name:'食費（自炊）'},{id:'c02',name:'食費（外食）'},{id:'c03',name:'日用品'},{id:'c04',name:'光熱費'},
  {id:'c05',name:'通信費'},{id:'c06',name:'交通費'},{id:'c07',name:'医療費'},{id:'c08',name:'衣服・美容'},
  {id:'c09',name:'娯楽・趣味'},{id:'c10',name:'交際費'},{id:'c11',name:'教育費'},{id:'c12',name:'住居費'},
  {id:'c13',name:'保険料'},{id:'c14',name:'車両費'},{id:'c15',name:'税金'},{id:'c16',name:'貯蓄・投資'},
  {id:'c17',name:'書籍'},{id:'c18',name:'家具・家電'},{id:'c19',name:'旅行'},{id:'c20',name:'ペット'},
  {id:'c21',name:'冠婚葬祭'},{id:'c22',name:'その他'}
];

let purchases = [];
let income = [];
let budgets = [];
let editingExpId = null;
let editingIncId = null;

function init() {
  const today = new Date().toISOString().split('T')[0];
  const thisMonth = new Date().toISOString().substring(0, 7);
  document.getElementById('expenseDate').value = today;
  document.getElementById('incomeMonth').value = thisMonth;
  document.getElementById('dashMonth').value = thisMonth;
  document.getElementById('budgetMonth').value = thisMonth;
  
  const grid = document.getElementById('categoryButtons');
  grid.innerHTML = categories.map(c => '<button type="button" class="category-btn" onclick="selectCategory(\''+c.id+'\')">'+c.name+'</button>').join('');
  
  const filterCat = document.getElementById('filterExpCategory');
  filterCat.innerHTML = '<option value="">全カテゴリ</option>' + categories.map(c => '<option value="'+c.id+'">'+c.name+'</option>').join('');
  
  const budgetCat = document.getElementById('budgetCategory');
  budgetCat.innerHTML = '<option value="">カテゴリ</option>' + categories.map(c => '<option value="'+c.id+'">'+c.name+'</option>').join('');
  
  loadLocalData();
  updateDashboard();
}

function showTab(tabName) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById(tabName).classList.add('active');
  event.target.classList.add('active');
  
  if (tabName === 'expenseHistory') filterExpenses();
  if (tabName === 'incomeHistory') filterIncome();
  if (tabName === 'budgets') updateBudgets();
}

function selectCategory(id) {
  document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('selected'));
  event.target.classList.add('selected');
  document.getElementById('selectedCategory').value = id;
}

function addExpense(e) {
  e.preventDefault();
  const categoryId = document.getElementById('selectedCategory').value;
  if (!categoryId) { showMessage('expenseMessage', 'カテゴリを選択してください', 'error'); return; }
  
  purchases.push({
    id: 'p' + Date.now(),
    date: document.getElementById('expenseDate').value,
    categoryId: categoryId,
    item: document.getElementById('expenseItem').value,
    amount: parseFloat(document.getElementById('expenseAmount').value),
    userId: 'u001',
    memo: document.getElementById('expenseMemo').value,
    createdAt: new Date().toISOString()
  });
  
  saveLocalData();
  showMessage('expenseMessage', '✅ 保存しました', 'success');
  document.getElementById('expenseForm').reset();
  document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('selected'));
  init();
}

function addIncome(e) {
  e.preventDefault();
  income.push({
    id: 'i' + Date.now(),
    yearMonth: document.getElementById('incomeMonth').value,
    type: document.getElementById('incomeType').value,
    amount: parseFloat(document.getElementById('incomeAmount').value),
    userId: 'u001',
    memo: document.getElementById('incomeMemo').value,
    createdAt: new Date().toISOString()
  });
  
  saveLocalData();
  showMessage('incomeMessage', '✅ 保存しました', 'success');
  document.getElementById('incomeForm').reset();
  init();
}

function saveLocalData() {
  localStorage.setItem('purchases', JSON.stringify(purchases));
  localStorage.setItem('income', JSON.stringify(income));
  localStorage.setItem('budgets', JSON.stringify(budgets));
}

function loadLocalData() {
  purchases = JSON.parse(localStorage.getItem('purchases') || '[]');
  income = JSON.parse(localStorage.getItem('income') || '[]');
  budgets = JSON.parse(localStorage.getItem('budgets') || '[]');
}

function updateDashboard() {
  const totalIncome = income.reduce((s, i) => s + i.amount, 0);
  const totalExpense = purchases.reduce((s, p) => s + p.amount, 0);
  const totalBalance = totalIncome - totalExpense;
  
  document.getElementById('totalIncome').textContent = '¥' + totalIncome.toLocaleString();
  document.getElementById('totalExpense').textContent = '¥' + totalExpense.toLocaleString();
  document.getElementById('totalBalance').textContent = '¥' + totalBalance.toLocaleString();
  document.getElementById('totalBalance').className = 'stat-value ' + (totalBalance >= 0 ? 'balance' : 'expense');
  
  const month = document.getElementById('dashMonth').value;
  const monthIncome = income.filter(i => i.yearMonth === month).reduce((s, i) => s + i.amount, 0);
  const monthPurchases = purchases.filter(p => p.date.startsWith(month));
  const monthExpense = monthPurchases.reduce((s, p) => s + p.amount, 0);
  
  document.getElementById('monthIncome').textContent = '¥' + monthIncome.toLocaleString();
  document.getElementById('monthExpense').textContent = '¥' + monthExpense.toLocaleString();
  document.getElementById('monthBalance').textContent = '¥' + (monthIncome - monthExpense).toLocaleString();
  document.getElementById('monthBalance').className = 'stat-value ' + (monthIncome >= monthExpense ? 'balance' : 'expense');
  
  const catMap = new Map();
  monthPurchases.forEach(p => catMap.set(p.categoryId, (catMap.get(p.categoryId) || 0) + p.amount));
  const breakdown = Array.from(catMap.entries()).map(([id, amt]) => {
    const cat = categories.find(c => c.id === id);
    return {name: cat ? cat.name : '不明', amount: amt};
  }).sort((a,b) => b.amount - a.amount);
  
  document.getElementById('categoryBreakdown').innerHTML = breakdown.length ? breakdown.map(b => '<div class="item"><div class="item-header"><span>'+b.name+'</span><span class="expense">¥'+b.amount.toLocaleString()+'</span></div></div>').join('') : '<p style="color:#666;text-align:center;">データなし</p>';
  
  const recent = purchases.sort((a,b) => new Date(b.date) - new Date(a.date)).slice(0, 5);
  document.getElementById('recentExpenses').innerHTML = recent.length ? recent.map(p => {
    const cat = categories.find(c => c.id === p.categoryId);
    return '<div class="item"><div class="item-header"><span class="item-title">'+p.item+'</span><span class="item-amount expense">¥'+p.amount.toLocaleString()+'</span></div><div class="item-detail">'+p.date+' | '+(cat?cat.name:'')+'</div></div>';
  }).join('') : '<p style="color:#666;text-align:center;">データなし</p>';
}

function filterExpenses() {
  const month = document.getElementById('filterExpMonth').value;
  const cat = document.getElementById('filterExpCategory').value;
  const kw = document.getElementById('filterExpKeyword').value.toLowerCase();
  
  let filtered = purchases.slice();
  if (month) filtered = filtered.filter(p => p.date.startsWith(month));
  if (cat) filtered = filtered.filter(p => p.categoryId === cat);
  if (kw) filtered = filtered.filter(p => p.item.toLowerCase().includes(kw) || (p.memo && p.memo.toLowerCase().includes(kw)));
  
  filtered.sort((a,b) => new Date(b.date) - new Date(a.date));
  document.getElementById('expHistoryCount').textContent = filtered.length + '件';
  
  const list = document.getElementById('expHistoryList');
  if (!filtered.length) { list.innerHTML = '<p style="color:#666;text-align:center;">データなし</p>'; return; }
  
  list.innerHTML = filtered.map(p => {
    const cat = categories.find(c => c.id === p.categoryId);
    const isEdit = editingExpId === p.id;
    
    if (isEdit) {
      return '<div class="edit-form"><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;"><input type="date" id="ed-'+p.id+'-date" value="'+p.date+'"><select id="ed-'+p.id+'-cat">'+categories.map(c => '<option value="'+c.id+'"'+(c.id===p.categoryId?' selected':'')+'>'+c.name+'</option>').join('')+'</select></div><input type="text" id="ed-'+p.id+'-item" value="'+p.item+'" style="width:100%;padding:10px;margin-bottom:10px;border-radius:8px;border:1px solid #ddd;"><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;"><input type="number" id="ed-'+p.id+'-amt" value="'+p.amount+'" style="padding:10px;border-radius:8px;border:1px solid #ddd;"><input type="text" id="ed-'+p.id+'-memo" value="'+(p.memo||'')+'" placeholder="メモ" style="padding:10px;border-radius:8px;border:1px solid #ddd;"></div><div style="display:flex;gap:10px;"><button class="btn btn-primary" style="flex:1;" onclick="saveExpEdit(\''+p.id+'\')">保存</button><button class="btn" style="flex:1;background:#9e9e9e;color:white;" onclick="cancelExpEdit()">キャンセル</button></div></div>';
    }
    
    return '<div class="item"><div class="item-header"><div class="item-title">'+p.item+'</div><div class="item-actions"><span class="item-amount expense">¥'+p.amount.toLocaleString()+'</span><button class="btn-sm btn-primary" onclick="editExp(\''+p.id+'\')">編集</button><button class="btn-sm btn-danger" onclick="deleteExp(\''+p.id+'\')">削除</button></div></div><div class="item-detail">'+p.date+' | '+(cat?cat.name:'')+(p.memo?' | '+p.memo:'')+'</div></div>';
  }).join('');
}

function clearExpFilter() {
  document.getElementById('filterExpMonth').value = '';
  document.getElementById('filterExpCategory').value = '';
  document.getElementById('filterExpKeyword').value = '';
  filterExpenses();
}

function editExp(id) { editingExpId = id; filterExpenses(); }
function cancelExpEdit() { editingExpId = null; filterExpenses(); }
function saveExpEdit(id) {
  const p = purchases.find(x => x.id === id);
  if (!p) return;
  p.date = document.getElementById('ed-'+id+'-date').value;
  p.categoryId = document.getElementById('ed-'+id+'-cat').value;
  p.item = document.getElementById('ed-'+id+'-item').value;
  p.amount = parseFloat(document.getElementById('ed-'+id+'-amt').value);
  p.memo = document.getElementById('ed-'+id+'-memo').value;
  p.updatedAt = new Date().toISOString();
  saveLocalData();
  editingExpId = null;
  filterExpenses();
  updateDashboard();
  alert('✅ 更新しました');
}
function deleteExp(id) {
  if (!confirm('削除しますか？')) return;
  purchases = purchases.filter(p => p.id !== id);
  saveLocalData();
  filterExpenses();
  updateDashboard();
  alert('✅ 削除しました');
}

function filterIncome() {
  const month = document.getElementById('filterIncMonth').value;
  const type = document.getElementById('filterIncType').value;
  
  let filtered = income.slice();
  if (month) filtered = filtered.filter(i => i.yearMonth === month);
  if (type) filtered = filtered.filter(i => i.type === type);
  
  filtered.sort((a,b) => b.yearMonth.localeCompare(a.yearMonth));
  document.getElementById('incHistoryCount').textContent = filtered.length + '件';
  
  const list = document.getElementById('incHistoryList');
  if (!filtered.length) { list.innerHTML = '<p style="color:#666;text-align:center;">データなし</p>'; return; }
  
  list.innerHTML = filtered.map(inc => {
    const isEdit = editingIncId === inc.id;
    
    if (isEdit) {
      return '<div class="edit-form"><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;"><input type="month" id="ei-'+inc.id+'-month" value="'+inc.yearMonth+'"><select id="ei-'+inc.id+'-type"><option value="給与"'+(inc.type==='給与'?' selected':'')+'>給与</option><option value="副収入"'+(inc.type==='副収入'?' selected':'')+'>副収入</option><option value="賞与"'+(inc.type==='賞与'?' selected':'')+'>賞与</option><option value="その他"'+(inc.type==='その他'?' selected':'')+'>その他</option></select></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;"><input type="number" id="ei-'+inc.id+'-amt" value="'+inc.amount+'"><input type="text" id="ei-'+inc.id+'-memo" value="'+(inc.memo||'')+'" placeholder="メモ"></div><div style="display:flex;gap:10px;"><button class="btn btn-primary" style="flex:1;" onclick="saveIncEdit(\''+inc.id+'\')">保存</button><button class="btn" style="flex:1;background:#9e9e9e;color:white;" onclick="cancelIncEdit()">キャンセル</button></div></div>';
    }
    
    return '<div class="item"><div class="item-header"><div class="item-title">'+inc.yearMonth+' - '+inc.type+'</div><div class="item-actions"><span class="item-amount income">¥'+inc.amount.toLocaleString()+'</span><button class="btn-sm btn-primary" onclick="editInc(\''+inc.id+'\')">編集</button><button class="btn-sm btn-danger" onclick="deleteInc(\''+inc.id+'\')">削除</button></div></div>'+(inc.memo?'<div class="item-detail">'+inc.memo+'</div>':'')+'</div>';
  }).join('');
}

function clearIncFilter() {
  document.getElementById('filterIncMonth').value = '';
  document.getElementById('filterIncType').value = '';
  filterIncome();
}

function editInc(id) { editingIncId = id; filterIncome(); }
function cancelIncEdit() { editingIncId = null; filterIncome(); }
function saveIncEdit(id) {
  const inc = income.find(x => x.id === id);
  if (!inc) return;
  inc.yearMonth = document.getElementById('ei-'+id+'-month').value;
  inc.type = document.getElementById('ei-'+id+'-type').value;
  inc.amount = parseFloat(document.getElementById('ei-'+id+'-amt').value);
  inc.memo = document.getElementById('ei-'+id+'-memo').value;
  inc.updatedAt = new Date().toISOString();
  saveLocalData();
  editingIncId = null;
  filterIncome();
  updateDashboard();
  alert('✅ 更新しました');
}
function deleteInc(id) {
  if (!confirm('削除しますか？')) return;
  income = income.filter(i => i.id !== id);
  saveLocalData();
  filterIncome();
  updateDashboard();
  alert('✅ 削除しました');
}

function addBudget(e) {
  e.preventDefault();
  const month = document.getElementById('budgetMonth').value;
  const catId = document.getElementById('budgetCategory').value;
  const limit = parseFloat(document.getElementById('budgetLimit').value);
  
  budgets = budgets.filter(b => !(b.yearMonth === month && b.categoryId === catId));
  budgets.push({id: 'b'+month+'-'+catId, yearMonth: month, categoryId: catId, limit: limit, alertRate: 0.8});
  saveLocalData();
  document.getElementById('budgetForm').reset();
  updateBudgets();
  alert('✅ 予算を設定しました');
}

function updateBudgets() {
  const month = document.getElementById('budgetMonth').value;
  const monthBudgets = budgets.filter(b => b.yearMonth === month);
  const monthPurchases = purchases.filter(p => p.date.startsWith(month));
  
  const list = document.getElementById('budgetList');
  if (!monthBudgets.length) { list.innerHTML = '<div class="card"><p style="color:#666;text-align:center;">予算なし</p></div>'; return; }
  
  list.innerHTML = monthBudgets.map(b => {
    const cat = categories.find(c => c.id === b.categoryId);
    const spent = monthPurchases.filter(p => p.categoryId === b.categoryId).reduce((s, p) => s + p.amount, 0);
    const rate = spent / b.limit;
    const status = rate >= 1 ? 'exceeded' : rate >= b.alertRate ? 'warning' : 'ok';
    const color = status === 'exceeded' ? '#d32f2f' : status === 'warning' ? '#f57c00' : '#4caf50';
    const bg = status === 'exceeded' ? '#ffebee' : status === 'warning' ? '#fff3e0' : '#e8f5e9';
    
    return '<div class="budget-card" style="border-color:'+color+';background:'+bg+';"><div style="display:flex;justify-content:space-between;margin-bottom:10px;"><span style="font-weight:bold;">'+(cat?cat.name:'不明')+'</span>'+(status!=='ok'?'<span>'+(status==='exceeded'?'⚠️ 超過':'⚡ 警告')+'</span>':'')+'</div><div class="budget-bar"><div class="budget-fill" style="width:'+Math.min(rate*100,100)+'%;background:'+color+';"></div></div><div style="font-size:14px;color:#666;">¥'+spent.toLocaleString()+' / ¥'+b.limit.toLocaleString()+' ('+( rate*100).toFixed(1)+'%)</div></div>';
  }).join('');
}

async function loadFromOneDrive() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.multiple = true;
  input.onchange = async (e) => {
    for (const file of e.target.files) {
      const text = await file.text();
      const data = JSON.parse(text);
      if (file.name.includes('purchase')) purchases = data;
      if (file.name.includes('income')) income = data;
      if (file.name.includes('budget')) budgets = data;
    }
    saveLocalData();
    updateDashboard();
    alert('✅ 読み込みました');
  };
  input.click();
}

function saveToOneDrive() {
  // データをlocalStorageに保存（バックアップ）
  saveLocalData();
  
  // ファイルをダウンロード
  const files = [
    {data: purchases, name: 'purchases.json'},
    {data: income, name: 'income.json'},
    {data: budgets, name: 'budgets.json'}
  ];
  
  files.forEach(f => {
    const blob = new Blob([JSON.stringify(f.data, null, 2)], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = f.name;
    a.click();
    URL.revokeObjectURL(url);
  });
  
  // 少し待ってからOneDriveのアップロードページを開く
  setTimeout(() => {
    if (confirm('ファイルをダウンロードしました。\nOneDriveのアップロードページを開きますか？')) {
      // OneDriveのKakeiboDataフォルダのアップロードページを直接開く
      window.open('https://onedrive.live.com/?id=root&cid=YOUR_CID&qt=upload', '_blank');
      alert('📱 手順:\n1. ダウンロードした3つのファイルを選択\n2. アップロードをタップ\n3. 既存ファイルを上書き');
    }
  }, 1000);
}

function fallbackDownload() {
  const files = [
    {data: purchases, name: 'purchases.json'},
    {data: income, name: 'income.json'},
    {data: budgets, name: 'budgets.json'}
  ];
  files.forEach(f => {
    const url = URL.createObjectURL(new Blob([JSON.stringify(f.data, null, 2)], {type: 'application/json'}));
    const a = document.createElement('a');
    a.href = url;
    a.download = f.name;
    a.click();
  });
  alert('ダウンロードしたファイルをOneDriveのKakeiboDataにアップロード');
}

function showMessage(id, msg, type) {
  const el = document.getElementById(id);
  el.innerHTML = '<div class="message '+type+'">'+msg+'</div>';
  setTimeout(() => el.innerHTML = '', 3000);
}
